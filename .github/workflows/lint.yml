name: Lint

on:
  # Trigger the workflow on push or pull request,
  # but only for the main branch
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      # ESLint and Prettier must be in `package.json`
      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linters
        uses: wearerequired/lint-action@v2
        with:
          eslint: true
          eslint_extensions: ts

  env-schema:
    name: Check environment schema
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      # There is no .env in CI, so only the generated-file half of the check
      # runs: .env.example and docs/env-reference.md must match the schema.
      - name: Verify generated environment files are in sync
        run: pnpm env:check

      - name: Run environment schema tests
        run: pnpm test -- src/config/env

      # Without this the inferred Env type catches nothing in CI, and a
      # misspelled variable name can creep back in.
      - name: Type check
        run: pnpm typecheck
